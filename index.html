<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Замовлення з Корчми Родина</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a printed order slip; sticky section tabs on top, sticky total bar at the bottom. Cherry-red cross-stitch band is the only ornament. */
:root{
  --bg:#F4F5F2; --paper:#FFFFFF; --ink:#1D1A1A; --muted:#6B6866; --line:#E2E1DC;
  --cherry:#A3122A; --cherry-ink:#FFFFFF; --cherry-soft:#F6E3E5; --ok:#2F6B3A;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141313; --paper:#1E1C1C; --ink:#EFECEA; --muted:#A39E9A; --line:#332F2E;
  --cherry:#E0485E; --cherry-ink:#1A0A0D; --cherry-soft:#3A1C21; --ok:#7FC48A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141313; --paper:#1E1C1C; --ink:#EFECEA; --muted:#A39E9A; --line:#332F2E;
  --cherry:#E0485E; --cherry-ink:#1A0A0D; --cherry-soft:#3A1C21; --ok:#7FC48A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.stitch{height:10px;margin-top:4px;background:
  linear-gradient(45deg,transparent 40%,var(--cherry) 40% 60%,transparent 60%) 0 0/10px 10px,
  linear-gradient(-45deg,transparent 40%,var(--cherry) 40% 60%,transparent 60%) 0 0/10px 10px;opacity:.85}
header{padding-block:20px 8px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,6vw,30px);line-height:1.15;margin:12px 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.mode{display:flex;gap:6px;margin:16px 0 4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px}
.mode button{flex:1;border:0;background:transparent;color:var(--ink);font:600 14px var(--body);padding:9px 8px;border-radius:7px;cursor:pointer}
.mode button[aria-selected="true"]{background:var(--cherry);color:var(--cherry-ink)}
label.f{display:block;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
input[type=text],textarea{width:100%;font:500 16px var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--cherry);outline-offset:2px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:10px;margin-top:8px;scrollbar-width:none}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.tabs a b{font-family:var(--display);color:var(--cherry);margin-right:4px}
section{margin-top:18px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 60px)}
h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0 0 4px;display:flex;align-items:baseline;gap:8px}
h2 .lt{color:var(--cherry);font-weight:700}
h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
ul{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:12px}
li{display:grid;grid-template-columns:2.6em 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li.on{background:var(--cherry-soft)}
.code{font-family:var(--display);font-size:12px;color:var(--cherry);font-weight:700}
.nm{min-width:0}
.nm span{display:block}
.pr{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:4px}
.step button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 18px/1 var(--body);cursor:pointer}
.step button.add{background:var(--cherry);border-color:var(--cherry);color:var(--cherry-ink)}
.step output{min-width:1.4em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.step:not(.has) .minus,.step:not(.has) output{visibility:hidden}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tot{flex:1;min-width:120px}
.tot strong{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.tot small{display:block;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:12px 14px;font:700 14px var(--body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.p{background:var(--cherry);color:var(--cherry-ink)}
.btn.s{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.note{color:var(--muted);font-size:13px;margin:10px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.saved{background:var(--cherry-soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;font-weight:600}
.saved small{display:block;font-weight:400;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;z-index:7}
.review{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;white-space:pre-wrap;font-size:14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line)}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:0}
td.n,th.n{text-align:right}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 4px 8px;overflow-x:auto;margin-top:8px}
.grand{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 4px}
.grand strong{font-family:var(--display);font-size:22px}
.warn{color:var(--cherry);font-size:13px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}

.in-tg .bar{display:none}
.in-tg .wrap{padding-bottom:40px}
.in-tg .tabs{top:0}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="stitch" aria-hidden="true"></div>
    <h1>Замовлення з «Корчми Родина»</h1>
    <p class="sub">Оберіть страви, натисніть «Надіслати». Замовлення збережеться автоматично, у чат нічого писати не треба. Ціни з сайту rodyna.es, без доставки.</p>
    <div class="mode" role="tablist">
      <button id="m-order" role="tab" aria-selected="true">Моє замовлення</button>
      <button id="m-sum" role="tab" aria-selected="false">Підсумок для організатора</button>
    </div>
  </header>

  <div id="v-order">
    <label class="f" for="name">Ваше ім'я</label>
    <input type="text" id="name" placeholder="Наприклад, Олена" autocomplete="given-name">
    <nav class="tabs" id="tabs"></nav>
    <div id="menu"></div>
    <div id="saved" class="saved" hidden></div>
    <div id="preview" class="review" hidden></div>
  </div>

  <div id="v-sum" hidden>
    <div class="row">
      <button class="btn p" id="refresh">Оновити підсумок</button>
      <a class="btn s" id="sheet" href="#" target="_blank" rel="noopener" hidden>Відкрити таблицю</a>
    </div>
    <p class="note" id="sum-note">Підсумок рахується з усіх надісланих замовлень.</p>
    <div id="sum"></div>
  </div>
</div>

<div class="bar" id="bar">
  <div class="in">
    <div class="tot"><strong id="total">0,00 €</strong><small id="count">нічого не обрано</small></div>
    <button class="btn s" id="copy" aria-disabled="true">Копіювати</button>
    <button class="btn p" id="send" aria-disabled="true">Надіслати</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const MENU = [{"l":"А","t":"Закуски","g":[{"n":"Закуски","i":[["А1","Тапа з українського сала",1550],["А2","Рулетики з баклажана",1250],["А3","Тарілка маринованих овочів",2150],["А4","Тапа з копченої скумбрії",1250],["А5","Тапа з оселедця",1250],["А6","Тапа з яловичого язика",1450],["А7","Тапа з оселедцем і маслом",1350],["А8","Тапа з баклажаном",1050],["А9","Холодець",1850],["А10","Кров'янка",1250],["А11","Деруни",1250],["А12","Деруни з лососем",1550],["А13","Картопляні зрази з яловичиною",1450],["А14","Картопляні зрази з грибами",1450],["А15","Банош",1250],["А16","Курка з грибами під сиром",1450],["А17","Млинці з м'ясом",1250],["А18","Млинці з куркою, грибами й сиром",1250],["А19","Мариновані помідори",850],["А20","Квашена капуста",850],["А21","Мариновані огірки",850],["А22","Фаршировані яйця",1350],["А23","Морква по-корейськи",850],["А24","Мариновані гриби",850]]}]},{"l":"Б","t":"Салати й супи","g":[{"n":"Салати","i":[["Б1","Салат з лососем «Свято»",1150],["Б2","Оселедець під шубою",1250],["Б3","Салат з тунцем «Яринка»",950],["Б4","Салат «Козацький» з яловичим язиком",1250],["Б5","Олів'є",900],["Б6","Салат з буряка та квасолі",950],["Б7","Салат зі свіжих помідорів і огірків",1050],["Б8","«Яринка», 1 кг",4500],["Б9","Оселедець під шубою, 1 кг",5500],["Б10","Олів'є, 1 кг",5000],["Б11","«Козацький», 1 кг",5500]]},{"n":"Перші страви","i":[["Б12","Червоний борщ з пампушками",1390],["Б13","Зелений борщ зі шпинатом і яйцем",950],["Б14","Солянка",1350],["Б15","Курячий бульйон з макаронами",850],["Б16","Гороховий суп",950],["Б17","Суп з полтавськими галушками",850],["Б18","Бограч",1550],["Б19","Окрошка з яловичим язиком",1250]]}]},{"l":"В","t":"Гарячі страви","g":[{"n":"Гарячі страви","i":[["В1","Тушковане м'ясо з картоплею",1850],["В2","Кролик у білому вині з пюре",1650],["В3","Качка з яблуками й чорносливом",2150],["В4","Куряча котлета «Хрещатик»",1850],["В5","Ніжна томлена яловичина",1950],["В6","Смажений лосось з пюре",2050],["В7","Котлета по-київськи з пюре",2150],["В8","Курча табака",1850],["В9","Голубці",1490],["В10","Свиняча рулька томлена",2550],["В11","Гречана каша з тушкованими овочами",1050],["В12","Рибні котлети з пюре",1850],["В13","Курячі котлети з пюре",1750],["В14","Куряча котлета на пару з гречкою",1750],["В15","Рибна котлета з гречкою",1850],["В16","Куряча котлета з гречкою",1850],["В17","Куряча відбивна з пюре",1550],["В18","Гуляш з яловичини з пюре",1850],["В19","Куряча відбивна з гречкою",1550],["В20","Гуляш з яловичини з гречкою",1850],["В21","М'ясна котлета з гречкою",1750],["В22","Запечена куряча грудка з картоплею та овочами",1950],["В23","Тушкована капуста з м'ясом",1250],["В24","Смажена картопля з салом і цибулею",1250],["В25","Смажена картопля з куркою та грибами",1250],["В26","Тушкована капуста з грибами",1250],["В27","Рис зі свининою та нутом",1750],["В28","Картопляне пюре",550],["В29","Картопля фрі",450],["В30","Деруни з соусом з бекону, грибів і сиру",1750]]}]},{"l":"Г","t":"Вареники й десерти","g":[{"n":"Вареники","i":[["Г1","Вареники з м'ясом",1250],["Г2","Вареники з картоплею та грибами",1250],["Г3","Вареники з картоплею",1250],["Г4","Вареники з тушкованою капустою",1250],["Г5","Вареники із сиром (солоні)",1250],["Г6","Запечені вареники з м'ясом",1850],["Г7","Запечені вареники з картоплею",1850],["Г8","Вареники з вишнею",1550],["Г9","Вареники з вишнею на пару",1850],["Г10","Вареники із сиром (солодкі)",1250],["Г11","Полтавські вареники на пару з сиром",1850]]},{"n":"Додатки","i":[["Г12","Хліб",350],["Г13","Пампушка з часником",95],["Г14","Сметана",550],["Г15","Шкварки",450]]},{"n":"Десерти","i":[["Г16","Пиріг «Монастирська світлиця» з вишнею",950],["Г17","Яблучний рулет",750],["Г18","Медовик",850],["Г19","Млинці з сиром",1250],["Г20","Сирники",1050],["Г21","Млинці з нутелою",750],["Г22","Сирник з маком і вишнею",1050],["Г23","Наполеон",850],["Г24","Київський торт",1050],["Г25","Млинці з маком",950],["Г26","Млинці зі згущеним молоком",850],["Г27","Млинці з вишнею",1050],["Г28","Млинці з яблуком і корицею",850],["Г29","Набір млинців",2550],["Г30","Печиво «Горішки»",750]]}]},{"l":"Д","t":"Напої","g":[{"n":"Безалкогольні напої","i":[["Д1","Компот зі свіжих фруктів",350],["Д2","Компот, 1 л",1350],["Д3","Узвар",350],["Д4","Узвар, 1 л",1450],["Д5","Квас «Тарас»",350],["Д6","Фруктовий кисіль",350]]},{"n":"Алкогольні напої","i":[["Д7","Самогон, 0,5 л",3500],["Д8","Наливка вишнева, 0,5 л",3500],["Д9","Наливка вишнева, 0,25 л",1750],["Д10","Наливка смородинова, 0,5 л",3500],["Д11","Наливка смородинова, 0,25 л",1750],["Д12","Наливка полунична, 0,5 л",3500],["Д13","Наливка полунична, 0,25 л",1750],["Д14","Горілка, 0,5 л",2500],["Д15","Пиво «Закарпатське», 0,5 л",450],["Д16","Пиво «Львівське 1715», 0,5 л",450]]}]}];
// Адреса бекенду (Google Apps Script, веб-додаток). Порожньо = бекенд ще не підключено.
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxD_qYPtHJBShODaTHcilCMfvMa2SvhyQJNnNYDFPmT7mbW8dociY2loQW6CUofukDU/exec';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/112GZpKbctPtzHlQSMOE2PVN2IcsU6dHuAqwD0eQ4KdQ/edit';
const ITEMS = {};
MENU.forEach(s => s.g.forEach(g => g.i.forEach(([c,n,p]) => ITEMS[c] = {c,n,p})));
const eur = c => (c/100).toFixed(2).replace('.', ',') + ' €';
var update;
const $ = id => document.getElementById(id);
let qty = {};
try { const s = JSON.parse(localStorage.getItem('rodyna-draft') || '{}'); qty = s.q || {}; $('name').value = s.n || ''; } catch(e) {}
const save = () => { try { localStorage.setItem('rodyna-draft', JSON.stringify({q:qty, n:$('name').value})); } catch(e) {} };

// render menu
$('tabs').innerHTML = MENU.map(s => `<a href="#sec-${s.l}"><b>${s.l}</b>${s.t}</a>`).join('');
$('menu').innerHTML = MENU.map(s => `
  <section id="sec-${s.l}">
    <h2><span class="lt">${s.l}</span>${s.t}</h2>
    ${s.g.map(g => `${s.g.length > 1 ? `<h3>${g.n}</h3>` : ''}<ul>${g.i.map(([c,n,p]) => `
      <li id="row-${c}">
        <span class="code">${c}</span>
        <div class="nm"><span>${n}</span><span class="pr">${eur(p)}</span></div>
        <div class="step" id="st-${c}">
          <button class="minus" data-c="${c}" data-d="-1" aria-label="Менше: ${n}">−</button>
          <output id="q-${c}">0</output>
          <button class="add" data-c="${c}" data-d="1" aria-label="Додати: ${n}">+</button>
        </div>
      </li>`).join('')}</ul>`).join('')}
  </section>`).join('');

$('menu').addEventListener('click', e => {
  const b = e.target.closest('button[data-c]'); if (!b) return;
  const c = b.dataset.c; const v = Math.max(0, Math.min(20, (qty[c]||0) + +b.dataset.d));
  if (v) qty[c] = v; else delete qty[c];
  paintRow(c); update(); save();
});
$('name').addEventListener('input', () => { update(); save(); });

function paintRow(c){
  const v = qty[c]||0;
  $('q-'+c).textContent = v;
  $('st-'+c).classList.toggle('has', v>0);
  $('row-'+c).classList.toggle('on', v>0);
}
Object.keys(ITEMS).forEach(paintRow);

function orderText(){
  const name = $('name').value.trim() || 'Без імені';
  const codes = Object.keys(ITEMS).filter(c => qty[c]);
  let sum = 0;
  const lines = codes.map(c => { const it = ITEMS[c], q = qty[c]; sum += it.p*q; return `${c} ${it.n} ×${q} — ${eur(it.p*q)}`; });
  return {text: `👤 ${name}\n${lines.join('\n')}\nРазом: ${eur(sum)}`, sum, n: codes.reduce((a,c)=>a+qty[c],0), codes};
}
let sending = false, savedSig = '';
let tgUser = null;
function payload(){
  const o = orderText();
  return { name: $('name').value.trim() || 'Без імені', tg_id: tgUser ? String(tgUser.id) : '',
    items: o.codes.map(c => ({ code: c, name: ITEMS[c].n, qty: qty[c], price: ITEMS[c].p/100, order: Object.keys(ITEMS).indexOf(c) })) };
}
async function sendOrder(){
  const o = orderText(); if (!o.n || sending) return;
  if (!ENDPOINT) { toast('Бекенд ще не підключено'); return; }
  sending = true; update();
  try {
    const r = await fetch(ENDPOINT, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload()), redirect:'follow' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'save failed');
    savedSig = o.text;
    $('saved').innerHTML = `Замовлення збережено ✓<small>${o.n} ${plural(o.n)} на ${eur(o.sum)}. ${j.notified ? 'Бот надіслав вам його в особисті повідомлення.' : ''} Щоб змінити, виправте вибір і надішліть ще раз.</small>`;
    $('saved').hidden = false;
    toast('Збережено');
    try { window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred('success'); } catch(e){}
  } catch(e) {
    toast('Не вдалося зберегти. Перевірте інтернет і спробуйте ще раз');
  } finally { sending = false; update(); }
}
update = function(){
  const o = orderText();
  $('total').textContent = eur(o.sum);
  $('count').textContent = o.n ? `${o.n} ${plural(o.n)} · ${o.codes.length} ${o.codes.length===1?'страва':o.codes.length<5?'страви':'страв'}` : 'нічого не обрано';
  const ready = o.n > 0;
  $('copy').setAttribute('aria-disabled', !ready);
  $('send').setAttribute('aria-disabled', !ready || sending);
  $('preview').hidden = !ready;
  $('preview').textContent = ready ? 'Ваше замовлення:\n\n' + o.text : '';
  if (ready && savedSig && savedSig !== o.text) { $('saved').hidden = true; }
}
function plural(n){ const a=n%10,b=n%100; return a===1&&b!==11?'порція':a>=2&&a<=4&&(b<12||b>14)?'порції':'порцій'; }
update();

function toast(t){ const el=$('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2200); }
async function copyText(t){
  try { await navigator.clipboard.writeText(t); toast('Скопійовано'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Скопійовано');}catch(_){toast('Виділіть текст і скопіюйте вручну');} ta.remove(); }
}
$('copy').addEventListener('click', () => { const o = orderText(); if (o.n) copyText(o.text); });
$('send').addEventListener('click', sendOrder);

// mode switch
function setMode(sum){
  $('m-order').setAttribute('aria-selected', !sum); $('m-sum').setAttribute('aria-selected', sum);
  $('v-order').hidden = sum; $('v-sum').hidden = !sum; $('bar').hidden = sum;
}
$('m-order').onclick = () => setMode(false);
$('m-sum').onclick = () => setMode(true);

// organizer summary (from backend)
if (SHEET_URL) { $('sheet').href = SHEET_URL; $('sheet').hidden = false; }
async function loadSummary(){
  if (!ENDPOINT) { $('sum').innerHTML = '<p class="warn">Бекенд ще не підключено.</p>'; return; }
  $('refresh').setAttribute('aria-disabled', true); $('sum-note').textContent = 'Завантажую…';
  try {
    const r = await fetch(ENDPOINT + '?summary=1&_=' + Date.now(), { redirect:'follow' });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'bad');
    renderSum(d);
    $('sum-note').textContent = 'Оновлено ' + new Date().toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'}) + '. Без вартості доставки.';
  } catch(e) {
    $('sum-note').textContent = 'Не вдалося завантажити підсумок. Спробуйте ще раз.';
  } finally { $('refresh').setAttribute('aria-disabled', false); }
}
const esc = t => String(t).replace(/[<>&]/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]));
function renderSum(d){
  if (!d.people.length) { $('sum').innerHTML = '<p class="note">Замовлень ще немає.</p>'; return; }
  const forRest = d.dishes.map(x => `${x.name} — ${x.qty} шт.`).join('\n');
  const n = d.people.length;
  $('sum').innerHTML = `
    <div class="grand"><span>${n} ${n%10===1&&n%100!==11?'учасник':'учасників'}</span><strong>${eur(Math.round(d.total*100))}</strong></div>
    <h3>Замовити в ресторані</h3>
    <div class="card"><table><thead><tr><th>Код</th><th>Страва</th><th class="n">К-сть</th><th class="n">Сума</th></tr></thead><tbody>
      ${d.dishes.map(x => `<tr><td class="code">${esc(x.code)}</td><td>${esc(x.name)}</td><td class="n">${x.qty}</td><td class="n">${eur(Math.round(x.sum*100))}</td></tr>`).join('')}
    </tbody></table></div>
    <p><button class="btn s" id="copy-rest">Копіювати список для ресторану</button></p>
    <h3>Хто скільки платить</h3>
    <div class="card"><table><thead><tr><th>Учасник</th><th class="n">Сума</th></tr></thead><tbody>
      ${d.people.map(p => `<tr><td>${esc(p.name)}</td><td class="n">${eur(Math.round(p.sum*100))}</td></tr>`).join('')}
    </tbody></table></div>`;
  $('copy-rest').onclick = () => copyText(forRest);
}
$('refresh').addEventListener('click', loadSummary);
$('m-sum').addEventListener('click', () => { if (!$('sum').innerHTML) loadSummary(); });
</script>

<script>
// ---- Telegram Mini App integration ----
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg || !tg.initData) return;           // opened in a normal browser: keep the web UI
  document.documentElement.classList.add('in-tg');
  tg.ready(); tg.expand();
  const applyTheme = () => document.documentElement.setAttribute('data-theme', tg.colorScheme === 'dark' ? 'dark' : 'light');
  applyTheme(); tg.onEvent('themeChanged', applyTheme);
  try { tg.setHeaderColor(tg.colorScheme === 'dark' ? '#141313' : '#F4F5F2'); } catch(e){}

  const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
  const nameEl = document.getElementById('name');
  tgUser = u || null;
  if (u && !nameEl.value.trim()) { nameEl.value = [u.first_name, u.last_name].filter(Boolean).join(' '); nameEl.dispatchEvent(new Event('input')); }
  // відновити збережене замовлення з бекенду, якщо на пристрої немає чернетки
  if (u && ENDPOINT && !Object.keys(qty).length) {
    fetch(ENDPOINT + '?my=' + encodeURIComponent(u.id) + '&_=' + Date.now(), { redirect:'follow' }).then(r => r.json()).then(d => {
      if (!d.ok || !d.order || !d.order.length) return;
      d.order.forEach(it => { if (ITEMS[it.code]) qty[it.code] = Math.min(20, +it.qty || 0); });
      Object.keys(ITEMS).forEach(paintRow); update(); save();
      savedSig = orderText().text;
      $('saved').innerHTML = 'Це ваше збережене замовлення ✓<small>Можна змінити й надіслати ще раз.</small>'; $('saved').hidden = false;
    }).catch(() => {});
  }

  const mb = tg.MainButton;
  function syncMain(){
    const o = orderText();
    const organizer = document.getElementById('v-sum').hidden === false;
    if (organizer || !o.n) { mb.hide(); return; }
    mb.setParams({ text: (sending ? 'Зберігаю…' : 'Надіслати замовлення · ' + eur(o.sum)), is_active: !sending, is_visible: true });
  }
  mb.onClick(() => { try { tg.HapticFeedback.impactOccurred('light'); } catch(e){} sendOrder(); });
  // re-sync whenever the order or the mode changes
  const _update = update; update = function(){ _update(); syncMain(); };
  document.getElementById('m-order').addEventListener('click', syncMain);
  document.getElementById('m-sum').addEventListener('click', syncMain);
  syncMain();
})();
</script>
